<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCAMOVIES+</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#09090b;color:#fff;font-family:Arial,sans-serif}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#101012;border-bottom:1px solid #29292e;position:relative;z-index:5}
.logo{font-size:21px;font-weight:900;margin-right:auto}.logo b{color:#f43f5e}.tab{border:0;border-radius:10px;padding:10px 16px;background:#29292f;color:#fff;font-weight:700;cursor:pointer}.tab.active{background:#f43f5e}.ownerlink{color:#aaa;text-decoration:none;font-size:13px}
#movies{width:100%;height:calc(100% - 58px);border:0;display:block;background:#09090b}
#owner{display:none;min-height:calc(100% - 58px);padding:34px 18px}.wrap{max-width:850px;margin:auto}.hero{padding:24px 0}.hero h1{font-size:36px;margin:0 0 8px}.hero p{color:#aaa;margin:0}
.post{background:#151518;border:1px solid #2c2c32;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0003}.post p{font-size:17px;line-height:1.55;white-space:pre-wrap;margin:0 0 14px}.date{font-size:12px;color:#888}.empty{padding:35px;text-align:center;color:#888;background:#131315;border-radius:18px}.manage{display:inline-block;margin-top:12px;color:#fff}
@media(max-width:600px){.top{padding:0 9px;gap:6px}.logo{font-size:17px}.tab{padding:9px 10px}.ownerlink{display:none}.hero h1{font-size:29px}}
</style></head><body>
<nav class="top"><div class="logo">BCA<b>MOVIES+</b></div><button id="moviesTab" class="tab active">Movies</button><button id="ownerTab" class="tab">📣 Owner Messages <span id="msgCount"></span></button><a class="ownerlink" href="https://usingaiinschoolf4fun.github.io/BCAMOVIES-/owner.html">Owner Login</a></nav>
<iframe id="movies" src="BCAMOVIES_FINAL_POLISHED.html" title="BCAMOVIES+"></iframe>
<section id="owner"><div class="wrap"><div class="hero"><h1>📣 Owner Messages</h1><p><b>Announcements from the BCAMOVIES owner.</b> Check here for new movies, updates, and other messages.</p><a class="manage" href="https://usingaiinschoolf4fun.github.io/BCAMOVIES-/owner.html">🔐 Owner Login / Manage</a></div><div id="posts"><div class="empty">Loading owner messages…</div></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://hzydgsxjamynfabonszg.supabase.co","sb_publishable_yUMhCuP8O-4XJM7sTivo3w_AsEcYsqR");
const movies=document.getElementById("movies"),owner=document.getElementById("owner"),mt=document.getElementById("moviesTab"),ot=document.getElementById("ownerTab");
function show(which){const isOwner=which==="owner";movies.style.display=isOwner?"none":"block";owner.style.display=isOwner?"block":"none";mt.classList.toggle("active",!isOwner);ot.classList.toggle("active",isOwner);if(isOwner)loadPosts();}
mt.onclick=()=>show("movies");ot.onclick=()=>show("owner");loadPosts();

async function applyMoviePermissions(){
  const {data}=await sb.auth.getSession();
  const isOwner=(data.session?.user?.email||"").toLowerCase()==="jonathanspollard11@gmail.com";
  try{
    const d=movies.contentDocument;if(!d)return;
    let style=d.getElementById("onlinePermissions");
    if(!style){style=d.createElement("style");style.id="onlinePermissions";d.head.appendChild(style);}
    style.textContent=isOwner?"":`
      #add,#add2,#save,#merge,#clear,#extraAdd,label[for="merge"]{display:none!important}
      .card button.e,.card button.d,.card button.editx,.card button.delx{display:none!important}
    `;
    let banner=d.getElementById("ownerMessagesBanner");
    if(!banner){
      banner=d.createElement("button");banner.id="ownerMessagesBanner";
      banner.innerHTML="📣 <b>OWNER MESSAGES</b> — Click here for announcements";
      banner.style.cssText="display:block;width:calc(100% - 32px);max-width:1100px;margin:16px auto;padding:15px 18px;border:1px solid #f43f5e;border-radius:14px;background:#251116;color:white;font-size:16px;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 8px 25px #0005";
      banner.onclick=()=>show("owner");
      const target=d.querySelector("main")||d.body;target.insertBefore(banner,target.firstChild);
    }
  }catch(e){}
}
function watchMoviePage(){
  applyMoviePermissions();
  try{
    const d=movies.contentDocument;if(!d||d.__bcaObserver)return;
    d.__bcaObserver=new MutationObserver(()=>applyMoviePermissions());
    d.__bcaObserver.observe(d.body,{childList:true,subtree:true});
  }catch(e){}
}
movies.addEventListener("load",()=>{watchMoviePage();setTimeout(watchMoviePage,500);setTimeout(watchMoviePage,1500);});
sb.auth.onAuthStateChange(()=>setTimeout(watchMoviePage,0));
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadPosts(){const box=document.getElementById("posts");const {data,error}=await sb.from("owner_posts").select("*").order("created_at",{ascending:false});if(error){box.innerHTML='<div class="empty">Could not load Owner Chat.</div>';return}document.getElementById("msgCount").textContent=data?.length?"("+data.length+")":"";if(!data?.length){box.innerHTML='<div class="empty">No owner messages yet.</div>';return}box.innerHTML=data.map(p=>'<article class="post"><p>'+esc(p.message)+'</p><div class="date">BCAMOVIES owner • '+new Date(p.created_at).toLocaleString()+'</div></article>').join("");}
</script></body></html>
