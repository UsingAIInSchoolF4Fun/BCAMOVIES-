<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCA IMPOSTOR BETA</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2d1959,#0b0c17 70%);color:#f5f3ff;font:16px system-ui;min-height:100vh}main{max-width:680px;margin:auto;padding:30px 16px}.brand{text-align:center;margin:24px 0 30px}.brand small{letter-spacing:4px;color:#b6a4e8}.brand h1{font-size:clamp(42px,9vw,68px);margin:0;font-weight:950;letter-spacing:3px}.panel{background:#191a30;border:1px solid #48406a;border-radius:20px;padding:22px;margin:15px 0;box-shadow:0 14px 45px #0004}input,button{font:inherit;border-radius:11px;padding:13px 15px}input{width:100%;background:#101125;color:white;border:1px solid #585374;margin:7px 0 15px}button{background:#8455ed;border:0;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:default}.wide{width:100%}.secondary{background:#363650}.muted{color:#b1abc7;font-size:14px}.code{font-size:40px;font-weight:900;letter-spacing:8px;color:#d1b5ff;text-align:center}.player,.clue{background:#25243d;border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}#error{color:#ff9eb0;min-height:22px}.tag{display:inline-block;padding:5px 10px;background:#3b2c66;border-radius:99px;font-size:12px}h2{margin-top:0}button.pick{display:block;width:100%;margin:8px 0;text-align:left;background:#33314d}button.pick.on{outline:2px solid #c7b4ff;background:#6341a6}</style></head><body><main><div class="brand"><small>BCA MOVIES PRESENTS</small><h1>IMPOSTOR</h1><div class="muted">ONLINE CLASSROOM BETA</div></div><div id="app"><div class="panel"><h2>MAKE A ROOM</h2><label>Your name</label><input id="nm" maxlength="20" placeholder="Enter your name"><button class="wide" id="create">MAKE A ROOM</button></div><div class="panel"><h2>JOIN ROOM</h2><label>Room code</label><input id="rc" maxlength="4" placeholder="ABCD"><button class="wide secondary" id="join">JOIN ROOM</button></div></div><p id="error"></p><p class="muted" style="text-align:center">Beta: host must stay connected · 3–10 players · no accounts</p></main><script>
const $=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bank=[['Basketball','Sport'],['Pizza','Food'],['Penguin','Animal'],['Airport','Place'],['Minecraft','Video game'],['Volcano','Nature'],['Popcorn','Snack'],['Halloween','Holiday'],['Guitar','Instrument'],['Shark','Animal'],['Library','Place'],['Chocolate','Food'],['Soccer','Sport'],['Disney','Entertainment'],['Pancakes','Food'],['Elephant','Animal'],['Ocean','Nature'],['Backpack','School item'],['Hospital','Place'],['Swimming','Activity'],['Tennis','Sport'],['Ice cream','Dessert'],['Dragon','Mythical creature'],['Football','Sport']];
let peer,host=false,code='',name='',self='',links={},room=null,selected='',connected=false;
const id=()=>Math.random().toString(36).slice(2,6).toUpperCase(), announce=s=>{$('error').textContent=s||''}, send=(conn,msg)=>{if(conn&&conn.open)conn.send(msg)}, broadcast=()=>{if(!host)return;for(const [pid,c] of Object.entries(links))send(c,{type:'state',state:publicState(pid)}) ;render()};
function publicState(pid){let p=room.players.find(x=>x.id===pid);return {code:room.code,phase:room.phase,players:room.players.map(x=>({id:x.id,name:x.name,clue:x.clue,voted:!!x.vote})),hostId:room.hostId,turn:room.turn,round:room.round,word:room.phase==='result'?room.word:undefined,spyName:room.phase==='result'?room.players.find(x=>x.id===room.spy)?.name:undefined,role:room.phase==='role'||room.phase==='clues'||room.phase==='vote'?(pid===room.spy?'IMPOSTOR':'CREWMATE'):undefined,secret:room.phase==='role'||room.phase==='clues'||room.phase==='vote'?(pid===room.spy?room.hint:room.word):undefined,votes:room.phase==='result'?room.players.map(x=>({name:x.name,count:room.players.filter(y=>y.vote===x.id).length})):undefined,winning:room.phase==='result'?room.players.filter(x=>x.vote).length&&(()=>{let counts=room.players.map(p=>room.players.filter(x=>x.vote===p.id).length);return counts.indexOf(Math.max(...counts))===room.players.findIndex(x=>x.id===room.spy)&&counts.filter(n=>n===Math.max(...counts)).length===1})():undefined}}
function initial(){ $('app').innerHTML='<div class="panel"><h2>Join a game</h2><label>Your name</label><input id="nm" maxlength="20" placeholder="Enter your name"><label>Room code</label><input id="rc" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"><button class="wide" id="join">JOIN ROOM</button></div><div class="panel"><h2>Host a game</h2><p class="muted">Create a room for 3–10 players.</p><button class="wide secondary" id="create">MAKE A ROOM</button></div>'; $('join').onclick=()=>connect(false);$('create').onclick=()=>connect(true)}
function connect(make){name=($('nm')?.value||'').trim().slice(0,20);if(!name){announce('Enter your name first.');return}code=make?id():($('rc')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code)){announce('Enter a four-character room code.');return}host=make;self=make?'bca-imp-'+code:'bca-player-'+id()+id();announce('Connecting…');peer=new Peer(self);peer.on('error',e=>{announce(e.type==='unavailable-id'?'Room code already in use. Try creating again.':'Connection error: '+e.type);});peer.on('open',()=>{connected=true;if(make){room={code,hostId:self,players:[{id:self,name,clue:'',vote:''}],phase:'lobby',round:0,turn:0,spy:'',word:'',hint:''};peer.on('connection',incoming);render()}else{let c=peer.connect('bca-imp-'+code,{reliable:true});links.host=c;c.on('open',()=>send(c,{type:'join',name}));c.on('data',m=>{if(m.type==='state'){room=m.state;render()}if(m.type==='error')announce(m.message)});c.on('close',()=>announce('Host disconnected. Rejoin a new room.'));setTimeout(()=>{if(!room)announce('Could not join. Check the code and host connection.')},6500)}})}
function incoming(c){c.on('data',m=>{if(m.type==='join'){if(room.phase!=='lobby'||room.players.length>=10){send(c,{type:'error',message:'Room is full or game already started.'});return}let nm=String(m.name||'Player').trim().slice(0,20);if(room.players.some(p=>p.name.toLowerCase()===nm.toLowerCase())){send(c,{type:'error',message:'Name taken. Use a different name.'});return}links[c.peer]=c;room.players.push({id:c.peer,name:nm,clue:'',vote:''});broadcast()}else if(m.type==='action'){act(c.peer,m.action,m.value)}});c.on('close',()=>{delete links[c.peer];if(room.phase==='lobby'){room.players=room.players.filter(p=>p.id!==c.peer);broadcast()}})}
function act(pid,action,value){if(!host)return;let p=room.players.find(x=>x.id===pid);if(!p)return;if(action==='start'&&pid===self&&(room.phase==='lobby'||room.phase==='result')&&room.players.length>=3){let [word,hint]=bank[Math.floor(Math.random()*bank.length)];room.word=word;room.hint=hint;room.spy=room.players[Math.floor(Math.random()*room.players.length)].id;room.phase='role';room.round++;room.turn=0;room.players.forEach(x=>{x.clue='';x.vote=''})}else if(action==='clues'&&pid===self&&room.phase==='role'){room.phase='clues'}else if(action==='clue'&&room.phase==='clues'&&!p.clue){let clue=String(value||'').trim().slice(0,25);if(!/^\S+$/.test(clue))return;p.clue=clue;if(room.players.every(x=>x.clue))room.phase='vote'}else if(action==='vote'&&room.phase==='vote'&&!p.vote&&value!==pid&&room.players.some(x=>x.id===value)){p.vote=value;if(room.players.every(x=>x.vote))room.phase='result'}broadcast()}
function action(a,v){if(host)act(self,a,v);else send(links.host,{type:'action',action:a,value:v})}
function render(){if(!room)return;let p=room.players.find(x=>x.id===self),phase=room.phase;let out='<div class="panel"><div class="row"><span class="tag">ROUND '+room.round+'</span><span class="tag">'+safe(phase.toUpperCase())+'</span></div><p class="muted">ROOM CODE</p><div class="code">'+safe(room.code)+'</div></div>';if(phase==='lobby'){out+='<div class="panel"><h2>Waiting for players ('+room.players.length+'/12)</h2>'+room.players.map(x=>'<div class="player">'+safe(x.name)+(x.id===room.hostId?' 👑 HOST':'')+'</div>').join('')+(host?'<button class="wide" id="start" '+(room.players.length<3?'disabled':'')+'>START GAME</button>':'<p class="muted">Waiting for host to start…</p>')+'</div>'}else if(phase==='role'){out+='<div class="panel" style="text-align:center"><h2>'+safe(room.role|| (self===room.spy?'IMPOSTOR':'CREWMATE'))+'</h2><p class="muted">'+(host?(self===room.spy?'YOUR HINT':'SECRET SUBJECT'):(room.role==='IMPOSTOR'?'YOUR HINT':'SECRET SUBJECT'))+'</p><h1 style="color:#d1b5ff">'+safe(host?(self===room.spy?room.hint:room.word):room.secret||'')+'</h1>'+(host?'<button class="wide" id="clues">START CLUE ROUND</button>':'<p class="muted">Waiting for host…</p>')+'</div>'}else if(phase==='clues'){out+='<div class="panel"><h2>Clue round</h2><p class="muted">No assigned turns. When you are ready, click I’LL GO and submit your one-word clue.</p>'+(!p?.clue?'<button id="volunteer" class="wide">I’LL GO</button><div id="clueform" style="display:none"><input id="clue" maxlength="25" placeholder="Type ONE word"><button id="submit" class="wide">SEND CLUE</button></div>':'<p class="muted">Your clue is submitted. Waiting for the others…</p>')+'</div><div class="panel"><h2>Clues</h2>'+room.players.filter(x=>x.clue).map(x=>'<div class="clue">'+safe(x.name)+': <b>'+safe(x.clue)+'</b></div>').join('')+'</div>'}else if(phase==='vote'){out+='<div class="panel"><h2>Vote for the impostor</h2>'+(p?.voted?'<p class="muted">Vote submitted. Waiting for everyone…</p>':room.players.filter(x=>x.id!==self).map(x=>'<button class="pick" data-v="'+safe(x.id)+'">'+safe(x.name)+'</button>').join(''))+'</div><div class="panel"><h2>Clues</h2>'+room.players.map(x=>'<div class="clue">'+safe(x.name)+': '+safe(x.clue)+'</div>').join('')+'</div>'}else if(phase==='result'){out+='<div class="panel" style="text-align:center"><h2>'+((host?publicState(self).winning:room.winning)?'IMPOSTOR CAUGHT!':'IMPOSTOR ESCAPED!')+'</h2><p>The impostor was <b>'+safe(host?room.players.find(x=>x.id===room.spy)?.name:room.spyName)+'</b></p><p>Subject: <b>'+safe(room.word)+'</b></p></div><div class="panel"><h2>Votes</h2>'+(host?publicState(self).votes:room.votes||[]).map(x=>'<div class="player">'+safe(x.name)+' — '+x.count+'</div>').join('')+(host?'<button id="again" class="wide">PLAY AGAIN</button>':'<p class="muted">Waiting for host…</p>')+'</div>'}$('app').innerHTML=out;if($('start'))$('start').onclick=()=>action('start');if($('clues'))$('clues').onclick=()=>action('clues');if($('again'))$('again').onclick=()=>action('start');if($('volunteer'))$('volunteer').onclick=()=>{$('volunteer').style.display='none';$('clueform').style.display='block';$('clue').focus()};if($('submit'))$('submit').onclick=()=>{let v=$('clue').value.trim();if(!/^\S+$/.test(v)){announce('Use exactly one word.');return}action('clue',v)};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>action('vote',b.dataset.v))}
initial();
</script></body></html>
