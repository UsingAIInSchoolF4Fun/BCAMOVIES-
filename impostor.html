let glitchFrame=0;
function goldGlitch(){
 const canvas=document.getElementById('gold-glitch-canvas');if(!canvas)return;

 const dpr=Math.min(window.devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;

 const ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);

 const particles=Array.from({length:240},()=>({x:Math.random()*w,y:h+Math.random()*h*.23,size:3+Math.random()*12,speed:.35+Math.random()*.95,drift:(Math.random()-.5)*25,delay:Math.random()*260,color:colors[Math.floor(Math.random()*colors.length)]}));

 function frame(now){
  const elapsed=now-start;ctx.clearRect(0,0,w,h);
  const fade=Math.min(1,(duration-elapsed)/380);
  if(elapsed<duration){
   for(const p of particles){let t=elapsed-p.delay;if(t<0)continue;let progress=Math.min(1,t/1250);let y=p.y-progress*(h+250)*p.speed*1.9;let alpha=Math.max(0,Math.min(1,t/160))*(1-progress*.8)*fade;if(y< -25)continue;ctx.globalAlpha=alpha;ctx.fillStyle=p.color;ctx.shadowColor='#f6c36e';ctx.shadowBlur=10;ctx.fillRect(p.x+p.drift*progress,y,p.size,p.size)}
   ctx.shadowBlur=0;ctx.globalAlpha=.11*fade;ctx.fillStyle='#e8b45d';ctx.fillRect(0,h-Math.min(h,elapsed*.65),w,Math.min(h,elapsed*.65));ctx.globalAlpha=1;

  }else{ctx.clearRect(0,0,w,h);canvas.classList.remove('show')}

}
