function shorelineRadius(a){return 850+42*Math.sin(3*a+.25)+24*Math.cos(7*a-.7)+23*Math.sin(11*a+.9)+15*Math.cos(16*a)}

function makeRoad(id,points,width=27,style='urban'){roads.push({id,points,width,style});for(let i=0;i<points.length-1;i++){let a=points[i],b=points[i+1],d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.floor(d/20));for(let j=0;j<n;j++){let t=j/n,pt={x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),a:Math.atan2(b.y-a.y,b.x-a.x),id};if(coastDistance(pt.x,pt.y)>36)roadSamples.push(pt)}}}

 let buttons=Object.entries(UPGRADES).map(([id,u])=>{let level=save.upgrades[id]||0,cost=UPGRADE_COST[id][level];return `<button class="btn mini ${level>=3?'ghost':'gold'}" data-action="upgrade" data-id="${id}" ${level>=3||save.wallet<cost?'disabled':''}>${u.name} ${level}/3 · ${level>=3?'MAX':'$'+fmt(cost)}</button>`}).join('');
 let painter=['#61e6dc','#ffcc72','#ff7882','#9c95ff','#c5e4e9','#8fe692','#ff91ce'].map(color=>`<button data-action="paint" data-id="${color}" title="Paint vehicle ${color}" style="width:25px;height:25px;border-radius:50%;border:2px solid ${((save.paint[selected.id]||selected.color).toLowerCase()===color.toLowerCase())?'#fff':'#ffffff44'};background:${color};margin-right:4px"></button>`).join('');
 showOverlay(`<div class="garageHead"><div><div class="kicker">POLICE CHASE GARAGE // PERMANENT UPGRADES</div><h1>CHOOSE YOUR GETAWAY.</h1><p>Buy cars with money earned from surviving pursuits.</p></div><div class="wallet">$${fmt(save.wallet)}</div></div><div class="carGrid">${body}</div><div class="garageFoot"><div><div class="kicker" style="margin-bottom:8px">YOUR GLOBAL UPGRADES</div><div class="upgradeRow">${buttons}</div><div class="smalltext" style="margin-top:9px">Engine increases acceleration and top speed; armor protects from police rams; nitro lasts longer.</div><div style="display:flex;align-items:center;gap:9px;margin-top:9px"><span class="smalltext">CAR PAINT:</span>${painter}</div></div><div class="buttons"><button class="btn ghost" data-action="home">BACK</button><button class="btn primary" data-action="start">▶ START CHASE</button></div></div>`)}
function renderHelp(){mode='help';showOverlay(`<div class="kicker">SURVIVAL GUIDE // SINGLE-PLAYER ARCADE PURSUIT</div><h1 class="endHeading">ESCAPE. <span>SURVIVE.</span> UPGRADE.</h1><div class="subtitle">The police are chasing you the entire time. Each 27 seconds your wanted level increases, sending faster and more dangerous officers. Your cash grows continuously while your car is still running. At the end of every run, you keep the money you earned—even if the police wreck your ride.</div><div class="resultGrid"><div class="resultStat"><small>W / ↑</small><strong style="font-size:18px">ACCELERATE</strong></div><div class="resultStat"><small>A/D / ←→</small><strong style="font-size:18px">STEER</strong></div><div class="resultStat"><small>S / ↓</small><strong style="font-size:18px">BRAKE / REVERSE</strong></div><div class="resultStat"><small>SHIFT</small><strong style="font-size:18px">NITRO BOOST</strong></div><div class="resultStat"><small>SPACE</small><strong style="font-size:18px">DRIFT</strong></div><div class="resultStat"><small>ESC</small><strong style="font-size:18px">PAUSE</strong></div></div><p class="smalltext">Collect glowing money pickups, pull off drifts, and narrowly miss civilian cars for bonus cash. The coast is open—you can drive into the ocean, but you'll sink if you stay in deep water. Vehicles and upgrades persist in this browser.</p><div class="buttons"><button class="btn primary" data-action="start">START CHASE</button><button class="btn ghost" data-action="home">BACK</button></div>`)}
function renderResults(){showOverlay(`<div class="kicker">PURSUIT ENDED // RUN ${save.runs}</div><h1 class="endHeading">CHASE <span>OVER.</span></h1><p class="reason">${finishReason}</p><div class="resultGrid"><div class="resultStat"><small>SURVIVED</small><strong>${timeFmt(runningSeconds)}</strong></div><div class="resultStat"><small>NEW CASH BANKED</small><strong style="color:#9efcc7">+$${fmt(earned)}</strong></div><div class="resultStat"><small>HEAT REACHED</small><strong>${'★'.repeat(wave)}</strong></div><div class="resultStat"><small>NEAR MISSES</small><strong>${fmt(runInfo.nearMisses)}</strong></div><div class="resultStat"><small>DRIFT BONUSES</small><strong>${fmt(runInfo.drifts)}</strong></div><div class="resultStat"><small>BANK TOTAL</small><strong>$${fmt(save.wallet)}</strong></div></div><div class="buttons"><button class="btn primary" data-action="start">↻ TRY AGAIN</button><button class="btn gold" data-action="garage">◈ BUY BETTER CARS</button><button class="btn ghost" data-action="home">MAIN MENU</button></div>`)}
function togglePause(){if(mode==='playing'){paused=true;mode='pause';showOverlay(`<div class="kicker">SUNSET CITY // CHASE PAUSED</div><h1 class="endHeading">TAKE A <span>BREATHER.</span></h1><p class="subtitle">Your run is paused at ${timeFmt(runningSeconds)}. Cash earned: $${fmt(earned)}. Resume to keep building your payout, or bank it and return to the garage.</p><div class="buttons"><button class="btn primary" data-action="resume">▶ RESUME CHASE</button><button class="btn gold" data-action="cashout">BANK CASH & GARAGE</button><button class="btn ghost" data-action="restart">RESTART</button></div>`)}else if(mode==='pause')resume()}
function resume(){mode='playing';paused=false;keys={};$('overlay').classList.add('hidden');last=performance.now()}
function clickAction(e){const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action,id=el.dataset.id;
 if(act==='start'){beginRun();return}if(act==='home'){renderHome();return}if(act==='garage'){renderGarage();return}if(act==='help'){renderHelp();return}if(act==='resume'){resume();return}if(act==='restart'){finishRun('You ended this chase early.');beginRun();return}if(act==='cashout'){finishRun('You escaped with your earnings.');renderGarage();return}
 if(act==='vehicle'){
  const v=CARS.find(c=>c.id===id);if(!v)return;
  if(save.owned.includes(id)){save.selected=id;persist();renderGarage()}
  else if(save.wallet>=v.price){save.wallet-=v.price;save.owned.push(id);save.selected=id;persist();renderGarage()}
  else{let tag=$('garageMsg');if(!tag){let el=document.createElement('div');el.id='garageMsg';el.className='smalltext';el.style.color='#ffb67e';el.style.marginTop='8px';document.querySelector('.garageFoot')?.appendChild(el);tag=el}if(tag)tag.textContent=`You need $${fmt(v.price-save.wallet)} more to buy ${v.name}.`}
  return;
 }
 if(act==='upgrade'){let level=save.upgrades[id]||0;if(!UPGRADES[id]||level>=3)return;let price=UPGRADE_COST[id][level];if(save.wallet<price)return;save.wallet-=price;save.upgrades[id]++;persist();renderGarage();return}
 if(act==='paint'){let current=save.selected;if(CARS.some(c=>c.id===current)){save.paint[current]=id;persist();renderGarage()}return}
}
$('screen').addEventListener('click',clickAction);
$('escapeBtn').addEventListener('click',togglePause);
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright','shift','escape','w','a','s','d'].includes(k))e.preventDefault();if(k==='escape'&&!e.repeat){togglePause();return}if(mode==='playing')keys[k]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{keys={};if(mode==='playing')togglePause()});
for(let b of document.querySelectorAll('.touch')){const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(mode==='playing'){keys[key]=true;b.classList.add('on')}});for(let evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>{keys[key]=false;b.classList.remove('on')})}
function frame(t){requestAnimationFrame(frame);let dt=last?clamp((t-last)/1000,0,.035):.016;last=t;try{if(mode==='playing')updatePlaying(dt);else now+=Math.min(dt,.025);render()}catch(err){console.error('ISLAND PURSUIT ERROR',err);$('hud').classList.remove('show');showOverlay(`<div class="kicker">GAME ERROR</div><h1 class="endHeading">A GLITCH <span>OCCURRED.</span></h1><p class="subtitle">${String(err?.message||err).replace(/[<>&]/g,'')} . You can safely return to the garage. Your purchased cars are saved.</p><button class="btn primary" data-action="home">MAIN MENU</button>`);mode='error'}}
resize();buildWorld();drawWorldBase();renderHome();requestAnimationFrame(frame);
})();
</script></body></html>
