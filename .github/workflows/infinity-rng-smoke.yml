name: INFINITY RNG browser smoke test
on:
  push:
    paths:
      - 'infinity-rng/**'
      - '.github/workflows/infinity-rng-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test driver
        run: npm install --no-save --no-audit --no-fund --silent playwright
      - name: Test world loading in real Chrome and collect exact errors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/infinity-server.log 2>&1 &
          sleep 2
          cat > /tmp/infinity-smoke.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']
            });
            let failed=false;
            for(const pageName of ['index.html']){
              const page=await browser.newPage({viewport:{width:1250,height:850}});
              const errors=[],logs=[];
              page.on('pageerror',e=>errors.push('PAGEERROR: '+String(e.stack||e)));
              page.on('console',m=>{
                if(m.type()==='error'||m.type()==='warning') logs.push(m.type().toUpperCase()+': '+m.text());
              });
              page.on('requestfailed',r=>logs.push('REQUEST FAILED '+r.url()+': '+(r.failure()?.errorText||'?')));
              try{
                await page.goto('http://127.0.0.1:8765/infinity-rng/'+pageName,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(3300);
                const status=await page.evaluate(()=>{
                  const l=document.getElementById('loading');
                  return {loadingClass:l?.className,loadingText:l?.innerText?.slice(0,700),canvasCount:document.querySelectorAll('canvas').length,threeLoaded:!!window.THREE,version:document.querySelector('.version')?.innerText};
                });
                console.log('CHECK '+pageName+' '+JSON.stringify(status));
                if(!status.loadingClass?.includes('hidden')||status.canvasCount<2){failed=true;console.log('FAIL '+pageName+' loading is not complete');}
              }catch(e){failed=true;console.log('NAV ERROR '+pageName+': '+(e.stack||e));}
              if(pageName==='index.html'&&errors.length===0){
                try{
                  const position=await page.evaluate(()=>{
                    player.position.set(0,ground(0,185)+44,185);
                    velocityY=-1;onGround=false;
                    return [player.position.x,player.position.y,player.position.z];
                  });
                  await page.keyboard.down('g');await page.waitForTimeout(950);await page.keyboard.up('g');
                  const flight=await page.evaluate(()=>({
                    display:document.getElementById('flightHud')?.style.display,
                    readout:document.getElementById('flightStats')?.textContent,
                    characterY:player.position.y,
                    isGliding:gliding
                  }));
                  console.log('GLIDE TEST position='+JSON.stringify(position)+' result='+JSON.stringify(flight));
                  if(flight.display!=='block'||!flight.isGliding){failed=true;console.log('FAIL flight did not activate');}
                  await page.keyboard.down('w');await page.waitForTimeout(350);await page.keyboard.up('w');
                  await page.keyboard.down('d');await page.waitForTimeout(350);await page.keyboard.up('d');
                  console.log('GLIDE STEERING CHECK '+JSON.stringify(await page.evaluate(()=>({
                    x:player.position.x,z:player.position.z,velocity:glideSpeed
                  }))));
                }catch(e){failed=true;console.log('FAIL FLIGHT TEST '+String(e.stack||e));}
              }
              if(pageName==='index.html'&&errors.length===0){
                try{
                  // End-to-end shrine reward logic using the actual in-game
                  // interaction/update code and all four airborne checkpoints.
                  const trial=await page.evaluate(()=>{
                    if(gliding)finishGlide();
                    state.pendingLuck=1;
                    const c=trialCourses.find(x=>x.id==='frost');
                    player.position.set(c.x,c.shrineY+1,c.z);
                    keys.KeyF=true;updateBiomeTrials(1);keys.KeyF=false;updateBiomeTrials(1);
                    const started=activeBiomeTrial?.course?.id==='frost',stages=[];
                    for(let i=0;i<4;i++){
                      const rune=c.checkpoints[i];
                      player.position.set(rune.x,rune.y+1.65,rune.z);
                      updateBiomeTrials(2+i);stages.push(activeBiomeTrial?.stage);
                    }
                    player.position.set(c.x,c.shrineY+1,c.z);
                    keys.KeyF=true;updateBiomeTrials(7);keys.KeyF=false;updateBiomeTrials(7);
                    return {started,stages,wins:state.trialWins.frost||0,
                      ownedVariant:c.names.some(n=>!!state.owned[n]),boost:state.pendingLuck,
                      cooldown:(state.trialCooldowns.frost||0)-Date.now(),
                      effectiveLuck:refreshLuck(),courseCount:trialCourses.length};
                  });
                  console.log('BIOME TRIAL RESULT '+JSON.stringify(trial));
                  if(!trial.started||trial.stages.join(',')!=='1,2,3,4'||trial.wins!==1||!trial.ownedVariant||trial.boost!==5||trial.effectiveLuck!==5||trial.cooldown<1000000||trial.courseCount!==7){
                    failed=true;console.log('FAIL biome trial reward, jump course or cooldown');
                  }
                  await page.click('#settingsButton');
                  const before=await page.evaluate(()=>({
                    settingsOpen:document.querySelector('#settingsPanel').classList.contains('open'),
                    compact:document.body.classList.contains('compact-ui'),
                    owned:Object.keys(state.owned).length,
                    catalog:A.length
                  }));
                  console.log('SETTINGS BEFORE '+JSON.stringify(before));
                  if(!before.settingsOpen||!before.compact){failed=true;console.log('FAIL Settings not open or compact UI disabled');}
                  await page.fill('#codeInput','HOMOPHOBIC');
                  await page.click('#redeemCodeButton');
                  const success=await page.evaluate(()=>({
                    owned:Object.keys(state.owned).length,total:A.length,
                    redeemed:!!state.redeemedCodes.HOMOPHOBIC,
                    rare:state.owned.INFINITY,
                    label:document.getElementById('codeStatus').textContent,
                    saved:!!JSON.parse(localStorage.getItem('infinity-rng-save-v1')).redeemedCodes?.HOMOPHOBIC
                  }));
                  console.log('REDEMPTION RESULT '+JSON.stringify(success));
                  if(success.owned!==success.total||success.total!==2088||!success.redeemed||!success.saved||success.rare<1){
                    failed=true;console.log('FAIL Unlock all auras not saved');
                  }
                  await page.fill('#codeInput','HOMOPHOBIC');
                  await page.click('#redeemCodeButton');
                  const second=await page.locator('#codeStatus').innerText();
                  console.log('SECOND REDEMPTION '+second);
                  if(!second.includes('Already redeemed')){failed=true;console.log('FAIL One-time restriction');}
                  await page.click('#closeSettings');
                  await page.click('#inventoryButton');
                  const inv=await page.evaluate(()=>({
                    visible:document.querySelectorAll('#items button').length,
                    total:document.getElementById('inventoryCount').textContent
                  }));
                  console.log('PAGED INVENTORY '+JSON.stringify(inv));
                  if(inv.visible>80||inv.visible<1){failed=true;console.log('FAIL inventory pagination');}
                  await page.fill('#inventorySearch','INFINITY');
                  console.log('SEARCH RESULTS '+await page.locator('#inventoryCount').innerText());
                  await page.click('#closeInventory');
                }catch(e){failed=true;console.log('FAIL CODE/SETTINGS TEST '+String(e.stack||e));}
              }
              if(errors.length){failed=true;console.log('FAIL Browser runtime errors: '+errors.length);}
              for(const e of errors.slice(0,15))console.log(e);
              for(const e of logs.slice(0,25))console.log(e.slice(0,1500));
              await page.close();
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/infinity-smoke.cjs
