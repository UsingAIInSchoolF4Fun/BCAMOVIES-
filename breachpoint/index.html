<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BREACHPOINT V1</title><style>html,body{margin:0;overflow:hidden;background:#070b11;color:white;font:14px Arial}#hud{position:fixed;inset:0;pointer-events:none}#stats{position:absolute;top:20px;left:22px;background:#07121bcc;padding:14px;border-left:3px solid #52c9e6;line-height:1.8}#ammo{position:absolute;bottom:30px;right:30px;font-size:30px;font-weight:bold}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;color:#aef}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#050a13dd;text-align:center;z-index:5}#panel{max-width:480px;padding:36px;background:#121c2c;border:1px solid #446179;border-radius:15px}button{padding:13px 32px;border:0;border-radius:7px;background:#39b8d5;color:#07121b;font-weight:bold;cursor:pointer}small{color:#aab}#hurt{position:fixed;inset:0;background:#f003;pointer-events:none;opacity:0}</style></head><body><div id="hud"><div id="stats"></div><div id="cross">+</div><div id="ammo"></div></div><div id="hurt"></div><div id="menu"><div id="panel"><h1>BREACHPOINT</h1><p>TACTICAL OPERATIONS · V1</p><p>Clear the hostile facility. Survive the encounter.</p><p><small>WASD move · Mouse aim · Click shoot · R reload · Shift sprint · Ctrl crouch · Right click aim</small></p><button id="start">DEPLOY</button></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x111a27);scene.fog=new T.Fog(0x111a27,24,68);const camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.06,90);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0x9ebddd,0x202635,2.1));const light=new T.DirectionalLight(0xffe5c6,1.35);light.position.set(5,14,9);scene.add(light);
const mats={floor:0x354352,wall:0x66717b,trim:0x202d39,crate:0x65513e,metal:0x364c5a,red:0x9a303b};const obstacles=[],shootables=[];function cube(x,y,z,w,h,d,c,solid=true){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.78}));m.position.set(x,y,z);scene.add(m);if(solid)obstacles.push({x,z,w,d});shootables.push(m);return m}
cube(0,-.16,0,48,.3,48,mats.floor,false);for(let i=-23;i<=23;i+=4){cube(i,.005,0,.035,.015,48,0x405161,false);cube(0,.006,i,48,.015,.035,0x405161,false)}
function wall(x,z,w,d){cube(x,2,z,w,4,d,mats.wall);cube(x,3.85,z,w,.22,d,mats.trim,false)}
wall(0,-24,48,.6);wall(0,24,48,.6);wall(-24,0,.6,48);wall(24,0,.6,48);
for(const z of [-12,12]){wall(-17,z,14,.45);wall(0,z,6,.45);wall(17,z,14,.45)}
for(const x of [-10,10]){wall(x,-18,.45,12);wall(x,-3,.45,8);wall(x,14,.45,19)}
for(let i=0;i<38;i++){const x=(Math.sin(i*17.2)*19),z=(Math.cos(i*9.3)*19);if(Math.abs(x)<3&&Math.abs(z-17)<5)continue;cube(x,.7,z,1.6,1.4,1.4,i%3?mats.crate:mats.metal)}
for(let i=0;i<16;i++){const x=-20+(i%4)*13,z=-20+Math.floor(i/4)*13;const m=new T.PointLight(0x8abde2,.55,12);m.position.set(x,3.5,z);scene.add(m);cube(x,3.94,z,1.4,.06,.4,0xb9d9e8,false)}
const gun=new T.Group();const gunmat=new T.MeshStandardMaterial({color:0x1d242c,metalness:.5,roughness:.4});function part(w,h,d,x,y,z,c=gunmat){const m=new T.Mesh(new T.BoxGeometry(w,h,d),c);m.position.set(x,y,z);gun.add(m)}part(.18,.18,.65,.23,-.22,-.55);part(.07,.08,.6,.23,-.19,-1.12);part(.14,.25,.13,.23,-.37,-.42);part(.07,.12,.17,.23,-.08,-.54);camera.add(gun);scene.add(camera);
let bots=[],hp=100,ammo=30,reserve=180,kills=0,active=false,loading=false,aim=false,yaw=0,pitch=0,shot=0;const keys={};const spawn=[[0,-19],[-17,-18],[17,-17],[-18,0],[18,0],[-17,17],[17,16],[0,-6],[0,6]];function createBot(x,z){const g=new T.Group(),body=new T.Mesh(new T.CapsuleGeometry(.35,.85,4,8),new T.MeshStandardMaterial({color:0x9c4248}));body.position.y=1.05;g.add(body);const head=new T.Mesh(new T.SphereGeometry(.25,10,8),new T.MeshStandardMaterial({color:0x252b31}));head.position.y=1.95;g.add(head);const visor=cube(0,0,0,.01,.01,.01,0,false);scene.remove(visor);const v=new T.Mesh(new T.BoxGeometry(.4,.12,.09),new T.MeshBasicMaterial({color:0x73c7e0}));v.position.set(0,1.98,-.22);g.add(v);g.position.set(x,0,z);scene.add(g);return {g,hp:100,cool:Math.random()*2,walk:Math.random()*6}}function reset(){bots.forEach(b=>scene.remove(b.g));bots=spawn.map(p=>createBot(...p));hp=100;ammo=30;reserve=180;kills=0;camera.position.set(0,1.7,19);yaw=0;pitch=0;active=true;loading=false;document.getElementById('menu').style.display='none';renderer.domElement.requestPointerLock?.()}function end(msg){active=false;document.exitPointerLock?.();document.getElementById('menu').style.display='grid';document.querySelector('#panel h1').textContent=msg;document.querySelector('#panel p').textContent='Hostiles eliminated: '+kills+'/9';document.getElementById('start').textContent='REDEPLOY'}
document.getElementById('start').onclick=reset;document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'&&!loading&&ammo<30&&reserve){loading=true;setTimeout(()=>{if(active){const n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n}loading=false},1400)}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement||!active)return;yaw-=e.movementX*.0023;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0023))});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('mousedown',e=>{if(e.button===2)aim=true;if(e.button!==0||!active||document.pointerLockElement!==renderer.domElement||loading||ammo<=0||performance.now()-shot<110)return;shot=performance.now();ammo--;const dir=new T.Vector3(0,0,-1).applyEuler(camera.rotation),ray=new T.Raycaster(camera.position,dir,0,65);let target=null,dist=65;for(const b of bots){const hits=ray.intersectObject(b.g,true);if(hits.length&&hits[0].distance<dist){dist=hits[0].distance;target=b}}const walls=ray.intersectObjects(shootables,false);if(walls.length&&walls[0].distance<dist)target=null;if(target){target.hp-=48;if(target.hp<=0){scene.remove(target.g);bots=bots.filter(b=>b!==target);kills++;if(!bots.length)end('MISSION COMPLETE')}}pitch=Math.min(1.35,pitch+.018)});document.addEventListener('mouseup',e=>{if(e.button===2)aim=false});function free(x,z){if(Math.abs(x)>23.3||Math.abs(z)>23.3)return false;return !obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.35&&Math.abs(z-o.z)<o.d/2+.35)}let last=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.04);last=t;if(active){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const speed=(keys.ShiftLeft?6:3.5)*(keys.ControlLeft?.55:1),f=new T.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),r=new T.Vector3(Math.cos(yaw),0,Math.sin(yaw));let dx=0,dz=0;if(keys.KeyW){dx+=f.x;dz+=f.z}if(keys.KeyS){dx-=f.x;dz-=f.z}if(keys.KeyD){dx+=r.x;dz+=r.z}if(keys.KeyA){dx-=r.x;dz-=r.z}const l=Math.hypot(dx,dz)||1;dx=dx/l*speed*dt;dz=dz/l*speed*dt;if(free(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(free(camera.position.x,camera.position.z+dz))camera.position.z+=dz;camera.position.y+=( (keys.ControlLeft?1.12:1.7)-camera.position.y)*Math.min(1,dt*12);camera.fov+=( (aim?48:75)-camera.fov)*Math.min(1,dt*12);camera.updateProjectionMatrix();gun.position.set(aim?-.22:0,aim?.06:0,aim?.1:0);for(const b of bots){const v=new T.Vector3(camera.position.x-b.g.position.x,0,camera.position.z-b.g.position.z),d=v.length();b.g.rotation.y=Math.atan2(-v.x,-v.z);if(d<18&&d>3){const nx=b.g.position.x+v.x/d*dt*.8,nz=b.g.position.z+v.z/d*dt*.8;if(free(nx,b.g.position.z))b.g.position.x=nx;if(free(b.g.position.x,nz))b.g.position.z=nz}b.cool-=dt;if(d<14&&b.cool<=0){b.cool=1.4+Math.random()*.8;hp-=6+Math.floor(Math.random()*6);document.getElementById('hurt').style.opacity=.65;if(hp<=0)end('MISSION FAILED')}}document.getElementById('hurt').style.opacity=Math.max(0,Number(document.getElementById('hurt').style.opacity)-dt*2);document.getElementById('stats').innerHTML='BREACHPOINT / OPERATION CLEARANCE<br>HEALTH '+Math.max(0,hp)+'%<br>HOSTILES '+bots.length+' / 9';document.getElementById('ammo').textContent=(loading?'RELOADING':ammo+' / '+reserve)}renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
