<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCAMOVIES+ Owner</title><style>
body{margin:0;background:#09090b;color:#fff;font:16px Arial,sans-serif}header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:#111}.logo{font-size:25px;font-weight:800}.logo b{color:#f43f5e}.wrap{max-width:900px;margin:auto;padding:35px 20px}.card{background:#151518;border:1px solid #2b2b31;border-radius:18px;padding:22px;margin-bottom:22px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #38383f;background:#0e0e11;color:#fff}button{background:#f43f5e;border:0;font-weight:700;cursor:pointer}.secondary{background:#29292f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;border-top:1px solid #2b2b31}.small{opacity:.7;font-size:13px}a{color:#fff}.hidden{display:none}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><header><div class="logo">BCA<b>MOVIES+</b> OWNER</div><a href="./">← Movies</a></header><main class="wrap">
<div class="card" id="loginCard"><h2>🔐 Owner Login</h2><p>Sign in as jonathanspollard11@gmail.com.</p><input id="email" type="email" value="jonathanspollard11@gmail.com"><input id="password" type="password" placeholder="Password"><button id="login">Log In</button><p class="small" id="loginMsg"></p></div>
<div id="ownerArea" class="hidden"><div class="card"><div class="row"><div><h2>Owner Mode</h2><p class="small" id="who"></p></div><div><button class="secondary" id="logout">Log Out</button></div></div></div>
<div class="card"><h2>🎬 Add Movie</h2><input id="title" placeholder="Movie title"><input id="movieUrl" placeholder="Google Drive / movie URL"><input id="posterUrl" placeholder="Poster image URL (optional)"><select id="library"><option value="main">Movies</option><option value="extra">Extra Movies</option></select><button id="addMovie">Publish Movie</button><p id="movieMsg" class="small"></p><div id="movieList"></div></div>
<div class="card"><h2>📊 Create Community Poll</h2><input id="pollQuestion" placeholder="Poll question"><input id="pollOptions" placeholder="Options separated by |  Example: Cars | Shrek | Spider-Man"><button id="createPoll">Publish Poll</button><p id="pollMsg" class="small"></p></div><div class="card"><h2>💬 Owner Chat</h2><textarea id="message" rows="4" placeholder="Post an update to everyone..."></textarea><button id="post">Publish Message</button><p id="postMsg" class="small"></p><div id="postList"></div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://hzydgsxjamynfabonszg.supabase.co","sb_publishable_yUMhCuP8O-4XJM7sTivo3w_AsEcYsqR");
const owner="jonathanspollard11@gmail.com";
const $=id=>document.getElementById(id);
async function refreshSession(){const {data}=await sb.auth.getSession();const u=data.session?.user;if(u&&u.email?.toLowerCase()===owner){$("loginCard").classList.add("hidden");$("ownerArea").classList.remove("hidden");$("who").textContent="Signed in as "+u.email;load();}else{$("loginCard").classList.remove("hidden");$("ownerArea").classList.add("hidden");}}
$("login").onclick=async()=>{ $("loginMsg").textContent="Signing in…";const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginMsg").textContent=error?error.message:"Signed in.";refreshSession();};
$("logout").onclick=async()=>{await sb.auth.signOut();refreshSession()};
$("addMovie").onclick=async()=>{const row={title:$("title").value.trim(),movie_url:$("movieUrl").value.trim(),poster_url:$("posterUrl").value.trim()||null,library:$("library").value};if(!row.title||!row.movie_url)return $("movieMsg").textContent="Title and movie URL are required.";const {error}=await sb.from("movies").insert(row);$("movieMsg").textContent=error?error.message:"Movie published.";if(!error){$("title").value="";$("movieUrl").value="";$("posterUrl").value="";loadMovies();}};
$("post").onclick=async()=>{const message=$("message").value.trim();if(!message)return;const {error}=await sb.from("owner_posts").insert({message});$("postMsg").textContent=error?error.message:"Message published.";if(!error){$("message").value="";loadPosts();}};
async function loadMovies(){const {data,error}=await sb.from("movies").select("*").order("created_at",{ascending:false});$("movieList").innerHTML=error?error.message:(data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b> <span class="small">('+esc(x.library)+')</span><br><button class="secondary" onclick="delMovie('+x.id+')">Delete</button></div>').join("")||'<p class="small">No live movies yet.</p>';}
async function loadPosts(){const {data,error}=await sb.from("owner_posts").select("*").order("created_at",{ascending:false});$("postList").innerHTML=error?error.message:(data||[]).map(x=>'<div class="item">'+esc(x.message)+'<br><button class="secondary" onclick="delPost('+x.id+')">Delete</button></div>').join("")||'<p class="small">No posts yet.</p>';}
async function delMovie(id){if(confirm("Delete this movie?")){await sb.from("movies").delete().eq("id",id);loadMovies();}}
async function delPost(id){if(confirm("Delete this post?")){await sb.from("owner_posts").delete().eq("id",id);loadPosts();}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("createPoll").onclick=async()=>{const question=$("pollQuestion").value.trim(),options=$("pollOptions").value.split("|").map(x=>x.trim()).filter(Boolean);if(!question||options.length<2)return $("pollMsg").textContent="Add a question and at least 2 options.";const {error}=await sb.from("polls").insert({question,options});$("pollMsg").textContent=error?error.message:"Poll published!";if(!error){$("pollQuestion").value="";$("pollOptions").value="";}};function load(){loadMovies();loadPosts()} refreshSession(); sb.auth.onAuthStateChange(()=>setTimeout(refreshSession,0));
</script></body></html>
