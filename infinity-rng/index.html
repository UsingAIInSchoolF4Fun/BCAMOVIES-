<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INFINITY RNG</title><style>*{box-sizing:border-box}body{margin:0;background:#070715;color:white;font-family:Arial;overflow:hidden}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}header{padding:16px;background:#09091bbd;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;color:#d9b4ff}button{pointer-events:auto;background:#753be0;color:white;border:1px solid #ae80ff;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}button:hover{background:#9858fc}#bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-align:center;width:min(95%,520px);background:#101024d9;border:1px solid #7653aa;border-radius:20px;padding:16px}#result{font-size:23px;font-weight:900;margin:8px}#inventory{display:none;position:absolute;right:12px;top:75px;width:min(340px,94vw);max-height:65vh;overflow:auto;background:#111127f5;border:1px solid #8557ce;border-radius:16px;padding:14px;pointer-events:auto}#inventory button{width:100%;margin:4px 0;text-align:left}small{color:#bcb2ce}#stats{font-size:13px;color:#ddd}#help{position:absolute;top:75px;left:12px;color:#bbb;font-size:13px}a{color:#d9b4ff;pointer-events:auto}</style></head><body><div id="hud"><header><h1>∞ INFINITY RNG <small>V1.0</small></h1><span id="stats"></span><button id="inv">Inventory</button></header><div id="help">WASD / arrows: move · Drag: rotate camera</div><div id="inventory"><h2>Your Auras</h2><div id="items"></div><button id="close">Close</button></div><div id="bottom"><div id="result">ROLL FOR AN AURA</div><div id="odds"><small>Discover 12 unique auras</small></div><p><button id="roll">ROLL</button> <button id="auto">AUTO ROLL: OFF</button></p><small id="equipped">Equipped: None</small></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>

const key="infinity-rng-save-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){};let state={rolls:saved.rolls||0,owned:saved.owned||{},equipped:saved.equipped||"Dust"},busy=false,auto=false;const $=x=>document.getElementById(x);function save(){localStorage.setItem(key,JSON.stringify(state))}function stats(){$("stats").textContent="Rolls: "+state.rolls+" · Unique: "+Object.keys(state.owned).length+"/12";$("equipped").textContent="Equipped: "+state.equipped}function inventory(){const root=$("items");root.replaceChildren();A.slice().reverse().forEach(a=>{let n=state.owned[a[0]]||0;if(!n)return;let b=document.createElement("button");b.textContent=a[0]+" ×"+n+" · 1 in "+a[1]+(state.equipped===a[0]?" ✓":"");b.style.borderColor=a[2];b.onclick=()=>{state.equipped=a[0];save();stats();updateAura();inventory()};root.appendChild(b)})}function pick(){let r=Math.random();for(let i=A.length-1;i>=0;i--){if(r<1/A[i][1])return A[i]}return A[0]}function roll(){if(busy)return;busy=true;$("roll").disabled=true;let ticks=0;let interval=setInterval(()=>{let a=A[Math.floor(Math.random()*A.length)];$("result").textContent=a[0].toUpperCase();$("result").style.color=a[2];if(++ticks>=12){clearInterval(interval);let win=pick();state.rolls++;state.owned[win[0]]=(state.owned[win[0]]||0)+1;if(!saved.equipped&&state.rolls===1)state.equipped=win[0];$("result").textContent=win[0].toUpperCase();$("result").style.color=win[2];$("odds").textContent="1 in "+win[1];save();stats();inventory();updateAura();busy=false;$("roll").disabled=false;if(auto)setTimeout(roll,220)}},65)}$("roll").onclick=roll;$("auto").onclick=()=>{auto=!auto;$("auto").textContent="AUTO ROLL: "+(auto?"ON":"OFF");if(auto)roll()};$("inv").onclick=()=>{$("inventory").style.display="block";inventory()};$("close").onclick=()=>{$("inventory").style.display="none"};stats();

const scene=new THREE.Scene();scene.background=new THREE.Color("#090b22");scene.fog=new THREE.Fog("#090b22",35,90);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x99aaff,0x222244,2));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,16,10);scene.add(light);const mat=(c,em=0)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:em,roughness:.45});let floor=new THREE.Mesh(new THREE.CylinderGeometry(25,25,1,64),mat(0x242344));floor.position.y=-.6;scene.add(floor);let ring=new THREE.Mesh(new THREE.TorusGeometry(22,.2,8,80),new THREE.MeshBasicMaterial({color:0x7c3aed}));ring.rotation.x=Math.PI/2;ring.position.y=.03;scene.add(ring);for(let i=0;i<26;i++){let angle=i*2.399,dist=7+Math.sqrt(i)*2.6;let crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.7+(i%3)*.3,0),mat(i%2?0x8b5cf6:0x38bdf8,.7));crystal.position.set(Math.cos(angle)*dist,.7,Math.sin(angle)*dist);scene.add(crystal)}const player=new THREE.Group();scene.add(player);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.25,5,12),mat(0xe8d8ff));body.position.y=1.5;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.46,20,16),mat(0xf5c7a9));head.position.y=2.75;player.add(head);let visor=new THREE.Mesh(new THREE.BoxGeometry(.58,.17,.12),mat(0x14102d));visor.position.set(0,2.8,-.4);player.add(visor);let aura=new THREE.Group();player.add(aura);window.updateAura=()=>{while(aura.children.length)aura.remove(aura.children[0]);let a=A.find(x=>x[0]===state.equipped)||A[0];let color=new THREE.Color(a[2]);for(let i=0;i<3;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(1+i*.3,.045,8,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8-i*.15}));r.rotation.x=Math.PI/2;r.position.y=.5+i*.7;aura.add(r)}for(let i=0;i<16;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.05+(i%3)*.03,8,8),new THREE.MeshBasicMaterial({color}));p.userData.i=i;aura.add(p)}};updateAura();let keys={},yaw=0;onkeydown=e=>{keys[e.key.toLowerCase()]=true};onkeyup=e=>{keys[e.key.toLowerCase()]=false};let dragging=false,px=0;renderer.domElement.onpointerdown=e=>{dragging=true;px=e.clientX};onpointerup=()=>dragging=false;onpointermove=e=>{if(dragging){yaw+=(e.clientX-px)*.005;px=e.clientX}};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;let x=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft)),z=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup));if(x||z){let dx=x*Math.cos(yaw)+z*Math.sin(yaw),dz=z*Math.cos(yaw)-x*Math.sin(yaw);let len=Math.hypot(dx,dz);player.position.x+=dx/len*dt*6;player.position.z+=dz/len*dt*6;let radius=Math.hypot(player.position.x,player.position.z);if(radius>23){player.position.x*=23/radius;player.position.z*=23/radius}player.rotation.y=Math.atan2(-dx,-dz)}aura.children.forEach((p,i)=>{if(p.userData.i!==undefined){let v=i*2.4+t*.8;p.position.set(Math.cos(v)*(1.2+(i%3)*.3),1.3+Math.sin(t*2+i)*1.2,Math.sin(v)*(1.2+(i%3)*.3))}else p.rotation.z=t*.6});camera.position.lerp(new THREE.Vector3(player.position.x+Math.sin(yaw)*9,6,player.position.z+Math.cos(yaw)*9),.08);camera.lookAt(player.position.x,1.4,player.position.z);renderer.render(scene,camera)}frame()}
